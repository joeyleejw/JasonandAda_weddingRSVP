<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://joeyleejw.github.io/JasonandAda_weddingRSVP/">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    
    <title>Jason and Ada Wedding RSVP</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons font removed: the 3 icons used are inline SVGs (saves a blocking CSS file + ~130 KB font) -->
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <div id="mobile-only-message">
        <div class="mobile-only-content">
            <p class="mobile-only-icon">📱</p>
            <h2>Best Viewed on Mobile</h2>
            <p>This invitation was designed for mobile screens. Please open this page on your phone for the full
                experience.</p>
        </div>
    </div>
    <div id="page-content">
        <!-- navigation bar -->
        <nav class="navbar sticky-top">
            <div class="container justify-content-between">
                <span data-i18n="rsvpMain"></span>
                <span class="navbar-brand">囍</span>
                <a href="" class="nav-link dropdown-toggle" role="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <span id="current-lang-label">EN</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#" onclick="setLanguage('en'); return false;">EN</a></li>
                    <li><a class="dropdown-item" href="#" onclick="setLanguage('zh'); return false;">ZH</a></li>
                </ul>
            </div>
        </nav>

        <section id="welcome" class="z-2 position-relative">
            <div class="bg-main-section">
                <div class="bg-banner-wrapper bg-banner fade-in-section">
                    <div class="main-headline py-5 px-4">
                        <div class="container text-center">
                            <h2 class="mb-1 fade-in-section" data-i18n="welcomeHeadline"></h2>
                            <p class="fade-in-section" data-i18n="welcomeSubheadline"></p>
                        </div>

                    </div>
                    <div class="main-headline py-5">
                        <div class="container text-center">
                            <h1 class="display-1 fade-in-section" data-i18n="lovelyCouple"></h1>
                            <a href="#rsvp" class="rsvp-button fade-in-section"><span data-i18n="rsvpButton"></span> <i
                                    class="bi bi-arrow-down"><svg xmlns="http://www.w3.org/2000/svg" width="1em"
                                        height="1em" fill="currentColor" viewBox="0 0 16 16"
                                        style="vertical-align:-.125em" aria-hidden="true">
                                        <path fill-rule="evenodd"
                                            d="M8 1a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L7.5 13.293V1.5A.5.5 0 0 1 8 1" />
                                    </svg></i></a>
                            <p class="fade-in-section"><small data-i18n="RSVPbefore"></small></p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section id="details" class="position-relative z-1">
            <div class="fade-in-section">
                <div class="bg-banner-wrapper bg-banner rounded-big-top"></div>
                <div class="bg-banner-wrapper bg-banner rounded-big-btm"></div>
            </div>
        </section>
        <section id="rsvp">
            <div class="bg-banner-wrapper bg-banner bg-overlay position-relative">
                <div class="container text-center mb-4 fade-in-section" id="countdownText">
                    <h3 class="mb-0" data-i18n="RSVPheadline"></h3>
                    <p data-i18n="RSVPsubheadline" class="d-none"></p>
                </div>
                <div class="container mb-4">
                    <div class="row">
                        <div class="col-12 col-sm-4 mb-4 mb-sm-0">
                            <div id="countdown">
                                <div class="fade-in-section"><span id="days">0</span><label
                                        data-i18n="countdownDays"></label></div>
                                <div class="fade-in-section"><span id="hours">0</span><label
                                        data-i18n="countdownHours"></label></div>
                                <div class="fade-in-section"><span id="minutes">0</span><label
                                        data-i18n="countdownMinutes"></label></div>
                                <div class="fade-in-section"><span id="seconds">0</span><label
                                        data-i18n="countdownSeconds"></label></div>
                            </div>
                        </div>
                        <div class="col-12 col-sm-8">
                            <div class="position-relative playground fade-in-section">
                                <div class="date fade-in-section">
                                    <img loading="lazy" src="Assets/calendar.avif" alt="Calendar"><span
                                        data-i18n="RSVPdate"></span>
                                </div>
                                <div class="reception-time fade-in-section">
                                    <img loading="lazy" src="Assets/wine-glasses.avif" alt="Reception"> <span
                                        data-i18n="RSVPreception"></span>
                                </div>
                                <div class="dinner-time fade-in-section">
                                    <img loading="lazy" src="Assets/food-and-restaurant.avif" alt="Dinner"> <span
                                        data-i18n="RSVPdinner"></span>
                                </div>
                                <div class="dinner-time fade-in-section">
                                    <img loading="lazy" src="Assets/suit.avif" alt="Suit"> <span
                                        data-i18n="RSVPtheme"></span>
                                </div>
                                <div class="location fade-in-section">
                                    <img loading="lazy" src="Assets/maps.avif" alt="Map">
                                    <span data-i18n="RSVPlocation"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-section container p-4">
                    <div class="container text-center mb-3">
                        <h3 class="mb-2 fade-in-section"><span data-i18n="formSubheadline"></span><span
                                data-i18n="RSVPbefore"></span></h3>
                    </div>
                    <!-- form -->
                    <iframe name="hidden-iframe" style="display:none;"></iframe>

                    <form id="rsvp-form" class="fade-in-section" novalidate target="hidden-iframe" method="POST"
                        action="https://script.google.com/macros/s/AKfycbx7C51DdhvXx3W1keMZEEunrG2RslZSlHzDjxBO5HvA726pbh-FK43nf73U8OSLzKTw3w/exec">

                        <div class="row justify-content-between mb-3">
                            <div class="col-12 mb-3">
                                <!-- VISIBLE FIELDS -->
                                <label data-i18n="formFullname"></label>
                                <input type="text" id="name" required>
                            </div>
                            <div class="col-6"><label data-i18n="formInvitedBy"></label>
                                <select id="invitedBy" required>
                                    <option data-i18n="formWhichSide" value=""></option>
                                    <option data-i18n="formBride" value="Bride"></option>
                                    <option data-i18n="formGroom" value="Groom"></option>
                                </select>

                            </div>
                            <div class="col-6"><label data-i18n="formAttend"></label>
                                <select id="attending" required>
                                    <option data-i18n="formAttendselect" value=""></option>
                                    <option data-i18n="formAttendyes" value="yes"></option>
                                    <option data-i18n="formAttendno" value="no"></option>
                                </select>
                            </div>
                        </div>

                        <div id="attending-fields" style="display:none">
                            <div class="row justify-content-between">
                                <div class="col-6 mb-2">
                                    <label data-i18n="formPhoneNumber"></label>
                                    <div class="input-phone-number d-flex align-items-center">
                                        <span class="phone-prefix">+</span>
                                        <input type="tel" id="phone" placeholder="6012-345 6789">
                                    </div>
                                    <p id="phone-error" class="text-danger" style="display:none"
                                        data-i18n="formPhoneError"></p>
                                </div>
                                <div class="col-6 mb-2">
                                    <label data-i18n="formMealLabel"></label>
                                    <select class="dietary-select" id="dietary-select-1" data-guest="1">
                                        <option value="Select" data-i18n="formMealSelect"></option>
                                        <option value="Non-Halal" data-i18n="formMealNonHalal"></option>
                                        <option value="Halal" data-i18n="formMealHalal"></option>
                                        <option value="Vegetarian" data-i18n="formMealVegetarian"></option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label data-i18n="formGuestsNumber"></label>
                                    <input type="number" id="guests" min="1" value="1" class="mb-0">
                                </div>

                                <div class="col-12">
                                    <hr>
                                    <!-- Guest name fields get injected here -->
                                    <div id="guest-names-fields"></div>
                                </div>
                                <div class="col-12">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="has-children">
                                        <label class="form-check-label" for="has-children"
                                            data-i18n="formHasChildren"></label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div id="children-wrapper" style="display:none" class="mt-2 mb-3">
                                        <div class="row">
                                            <div class="col-6">
                                                <label data-i18n="formGuestsChildren"></label>
                                                <input type="number" id="children" min="0" value="0">
                                            </div>
                                            <div class="col-6">
                                                <label data-i18n="formBabyChairNeed"></label>
                                                <div id="babychair-wrapper">
                                                    <select id="babychair">
                                                        <!-- options get rebuilt dynamically in JS based on children count -->
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="regrets-field" class="mb-3" style="display:none">
                            <div class="d-flex flex-column">
                                <label data-i18n="formSendUsBlessingTitle"></label>
                                <textarea id="message" data-i18n-placeholder="placeholderMessage"
                                    placeholder="Wishing you a lifetime of love and happiness..."></textarea>
                            </div>
                        </div>

                        <!-- HIDDEN FIELDS -->
                        <input type="hidden" name="name" id="name-hidden">
                        <input type="hidden" name="invitedBy" id="invitedBy-hidden">
                        <input type="hidden" name="phone" id="phone-hidden">
                        <input type="hidden" name="attending" id="attending-hidden">
                        <input type="hidden" name="guests" id="guests-hidden">
                        <input type="hidden" name="guestNames" id="guestnames-hidden">
                        <input type="hidden" name="children" id="children-hidden">
                        <input type="hidden" name="babychair" id="babychair-hidden">
                        <input type="hidden" name="meals" id="meals-hidden">
                        <input type="hidden" name="message" id="message-hidden">

                        <button type="submit" data-i18n="buttonSubmit"></button>
                    </form>
                </div>
            </div>

        </section>
        <footer class="py-3">
            <div class="container">
                <div class="row justify-content-between">
                    <div class="col-12 col-sm-6"><small data-i18n="authorCopyright"></small></div>
                    <div class="col-12 col-sm-6">
                        <small><b data-i18n="contactUstext"></b></small>
                        <small>
                            <ul>
                                <li><span data-i18n="contactUsmale"></span>: <a href="tel:60129858990">+60 12-985
                                        8990</a></li>
                                <li><span data-i18n="contactUsfemale"></span>: <a href="tel:60102720104">+60 10-272
                                        0104</a></li>
                            </ul>
                        </small>
                    </div>
                </div>
            </div>
        </footer>
    </div>
    <div class="modal fade" id="confirmationModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content confirmation-modal p-3">
                <div class="modal-header border-0">
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <!-- Thank-you message (text switches for Yes / No in form.js) -->
                    <h2 class="modal-title mb-2" data-i18n="modalTitle"></h2>
                    <p id="modal-thank-you-message" class="mb-4" data-i18n="modalThankYouYes"></p>

                    <div class="d-flex gap-2 justify-content-center flex-wrap">
                        <button type="button" id="share-response-btn"><i class="bi bi-share me-1"><svg
                                    xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor"
                                    viewBox="0 0 16 16" style="vertical-align:-.125em" aria-hidden="true">
                                    <path
                                        d="M13.5 1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M11 2.5a2.5 2.5 0 1 1 .603 1.628l-6.718 3.12a2.5 2.5 0 0 1 0 1.504l6.718 3.12a2.5 2.5 0 1 1-.488.876l-6.718-3.12a2.5 2.5 0 1 1 0-3.256l6.718-3.12A2.5 2.5 0 0 1 11 2.5m-8.5 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m11 5.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3" />
                                </svg></i><span data-i18n="modalShare"></span></button>
                        <a id="add-calendar-btn" target="_blank"><i class="bi bi-calendar2-plus me-1"><svg
                                    xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor"
                                    viewBox="0 0 16 16" style="vertical-align:-.125em" aria-hidden="true">
                                    <path
                                        d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M2 2a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1z" />
                                    <path
                                        d="M2.5 4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5zM8 8a.5.5 0 0 1 .5.5V10H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V11H6a.5.5 0 0 1 0-1h1.5V8.5A.5.5 0 0 1 8 8" />
                                </svg></i><span data-i18n="modalAddCalendar"></span></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        type="text/javascript"></script>
    <script src="script/main.js" type="text/javascript"></script>
    <script src="script/translation.js" type="text/javascript"></script>
    <script src="script/language.js" type="text/javascript"></script>
    <script src="script/countdown.js" type="text/javascript"></script>
    <script src="script/form.js" type="text/javascript"></script>
</body>

</html>
